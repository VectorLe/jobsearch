name: Fieldnotes daily job watch update

on:
  schedule:
    - cron: '17 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fieldnotes-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update job feed and check curated links
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python scripts/refresh.py --root .
      - name: Rebuild self-contained site
        run: python scripts/build.py
      - name: Run tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.mjs
      - name: Commit updated data
        run: |
          git add data/opportunities.json data/snapshot.json data/live_jobs.json index.html netlify.toml
          if git diff --cached --quiet; then
            echo 'No changes to the job data'
            exit 0
          fi
          git -c user.name='fieldnotes-update-bot' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m 'data: refresh local job watch'
          git push
