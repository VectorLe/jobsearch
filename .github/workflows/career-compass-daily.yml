name: Career Atlas — daily research refresh

on:
  schedule:
    # 08:17 PST / 09:17 PDT; schedules are UTC and can be delayed by GitHub.
    - cron: '17 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fieldnotes-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh stored job links and optional external feed
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        shell: bash
        run: |
          python scripts/refresh.py --root .
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit refreshed snapshots
        shell: bash
        run: |
          git add data/snapshot.json data/live_jobs.json
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git -c user.name='fieldnotes-update-bot' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m 'data: refresh career watch snapshot'
          git push
